[project]
name = "noch-gut-data"
version = "0.1.0"
description = "Data extraction pipelines for noch-gut"
requires-python = ">=3.12"
dependencies = [
    # Shared
    "click>=8.1",
    "tqdm>=4.66",
    # Open Food Facts
    "orjson>=3.10",
    "isal>=1.8.0",
    "lingua-language-detector>=2.1.1",
    # Wikidata
    "sparqlwrapper>=2.0",
]

[project.scripts]
openfoodfacts = "openfoodfacts.__main__:cli"
wikidata-extinct = "wikidata_extinct.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openfoodfacts", "src/wikidata_extinct"]
